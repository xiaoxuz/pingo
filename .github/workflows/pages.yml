name: Publish website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync website to gh-pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages /tmp/pingo-pages origin/gh-pages
          find /tmp/pingo-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R website/. /tmp/pingo-pages/
          touch /tmp/pingo-pages/.nojekyll
          cd /tmp/pingo-pages
          git add -A
          if git diff --cached --quiet; then
            echo "Website is already up to date."
            exit 0
          fi
          git commit -m "Deploy website from ${GITHUB_SHA}"
          git push origin gh-pages
